name: Validate n8n Workflows

on:
  push:
    branches: [ main, master ]
    paths:
      - '**/*.json'
      - '.github/workflows/validate-workflows.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - '**/*.json'
      - '.github/workflows/validate-workflows.yml'
  workflow_dispatch:

jobs:
  validate-workflows:
    name: Validate n8n Workflows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Detect changed workflow files
        id: changed-files
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            mapfile -t files < <(find . -type f -name '*.json' -not -path './.git/*' | sort)
          else
            base_sha="${{ github.event.pull_request.base.sha || github.event.before }}"
            if [[ -z "$base_sha" || "$base_sha" == "0000000000000000000000000000000000000000" ]]; then
              base_sha="$(git rev-parse HEAD^ 2>/dev/null || echo HEAD)"
            fi
            mapfile -t files < <(git diff --name-only "$base_sha" HEAD -- '*.json' | sort)
          fi

          if [[ ${#files[@]} -eq 0 ]]; then
            echo "has_workflows=false" >> "$GITHUB_OUTPUT"
            echo "No workflow JSON files changed; skipping validation."
            exit 0
          fi

          printf '%s\n' "${files[@]}" > workflow-files.txt
          echo "has_workflows=true" >> "$GITHUB_OUTPUT"
          echo "Workflow files to validate:"
          cat workflow-files.txt

      - name: Validate changed workflow files
        if: steps.changed-files.outputs.has_workflows == 'true'
        run: |
          python .github/scripts/validate_workflows.py $(cat workflow-files.txt)

      - name: Optional workflow visualization
        if: github.event_name == 'workflow_dispatch' && steps.changed-files.outputs.has_workflows == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v n8n-visualize >/dev/null 2>&1; then
            echo "n8n-visualize is not installed; skipping visualization generation."
            exit 0
          fi

          mkdir -p workflow-visualizations
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            base_name="$(basename "$file" .json)"
            output_file="workflow-visualizations/${base_name}.png"
            echo "Generating visualization for $file"
            n8n-visualize "$file" -o "$output_file" --no-show 2>/dev/null || echo "::warning::Failed to create visualization for $file"
          done < workflow-files.txt

      - name: Upload workflow visualizations
        if: github.event_name == 'workflow_dispatch' && steps.changed-files.outputs.has_workflows == 'true' && hashFiles('workflow-visualizations/*.png') != ''
        uses: actions/upload-artifact@v4
        with:
          name: workflow-visualizations
          path: workflow-visualizations/
          if-no-files-found: ignore
          retention-days: 7

      - name: Comment on PR with validation results
        if: github.event_name == 'pull_request' && steps.changed-files.outputs.has_workflows == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const workflowFiles = fs.readFileSync('workflow-files.txt', 'utf8').trim().split('\n').filter(Boolean);
            const visCount = fs.existsSync('workflow-visualizations') ? fs.readdirSync('workflow-visualizations').length : 0;
            const comment = `✅ Validated ${workflowFiles.length} changed n8n workflow file(s).\n📊 ${visCount} visualization(s) generated.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.login === 'github-actions[bot]' &&
              comment.body.includes('Validated')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment,
              });
            }
